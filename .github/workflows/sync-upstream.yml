name: Sync upstream

on:
  schedule:
    # Once a day at 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync default branch from upstream
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream into the default branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          meta="$(gh repo view "$repo" --json isFork,defaultBranchRef)"
          is_fork="$(jq -r '.isFork' <<<"$meta")"
          branch="$(jq -r '.defaultBranchRef.name // empty' <<<"$meta")"

          if [ "$is_fork" != "true" ]; then
            echo "Not a fork: ${repo} has no upstream parent, so merge-upstream cannot run."
            exit 1
          fi

          if [ -z "$branch" ]; then
            echo "Could not determine the default branch of ${repo}."
            exit 1
          fi

          set +e
          resp="$(gh api --method POST "repos/${repo}/merge-upstream" -f "branch=${branch}" 2>&1)"
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$resp"
            if printf '%s\n' "$resp" | grep -Eiq 'merge conflict|HTTP 409'; then
              echo "Merge conflict: ${branch} diverged from upstream. Resolve it manually. This workflow will not force-push or try to resolve the conflict."
              exit 1
            fi
            if printf '%s\n' "$resp" | grep -Eiq 'not a fork'; then
              echo "Not a fork: ${repo} has no upstream parent, so merge-upstream cannot run."
              exit 1
            fi
            echo "Upstream sync failed for ${branch}."
            exit 1
          fi

          merge_type="$(printf '%s\n' "$resp" | jq -r '.merge_type // empty' 2>/dev/null || true)"
          if [ "$merge_type" = "none" ]; then
            exit 0
          fi
          if [ -n "$merge_type" ]; then
            echo "Synced ${branch} from upstream (${merge_type})."
            exit 0
          fi

          printf '%s\n' "$resp"
